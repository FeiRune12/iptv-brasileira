name: Azure TV - Saude e alternativas seguras para canais

on:
  schedule:
    # Confere novas fontes de hora em hora e reavalia os links periodicamente.
    - cron: '19 * * * *'
  push:
    paths:
      - '.github/workflows/azure-tv-preview.yml'
      - 'scripts/azure_tv_preview.py'
      - 'scripts/azure_tv_reliable.py'
      - 'scripts/test_azure_tv_reliable.py'
      - 'scripts/export_azure_tv_test_channels.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-tv-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Verificar que filmes, series e favoritos ficam intactos
        run: python3 -m unittest discover -s scripts -p 'test_azure_tv_reliable.py' -v

      - name: Testar HLS e preparar somente alternativas confiaveis
        run: python3 scripts/azure_tv_reliable.py

      - name: Exportar lista pequena de canais verificados para testes no IPTV Expert
        run: python3 scripts/export_azure_tv_test_channels.py
